<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Coming Soon</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <style>
    html, body {
      height: 100%;
      margin: 0;
      background: #ffffff;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .wrapper {
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .logo {
      max-width: 320px;
      width: 80%;
      height: auto;
      margin-bottom: 20px;
    }

    .coming-soon {
      font-size: 14px;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: #555;
    }
    .glitch-wrapper {
  position: relative;
}

.glitch {
  position: relative;
  animation: glitch 3.5s infinite;
}

/* Color channel ghosts */
.glitch::before,
.glitch::after {
  content: "";
  position: absolute;
  inset: 0;
  background: url("Logo Text Site front page.png") no-repeat center;
  background-size: contain;
  opacity: 0.8;
  pointer-events: none;
}

.glitch::before {
  transform: translate(-2px, 0);
  filter: hue-rotate(20deg);
}

.glitch::after {
  transform: translate(2px, 0);
  filter: hue-rotate(-20deg);
}

@keyframes glitch {
  0%, 92%, 100% {
    transform: translate(0);
    filter: none;
  }

  93% {
    transform: translate(-1px, 1px);
  }

  94% {
    transform: translate(2px, -1px);
  }

  95% {
    transform: translate(-2px, 0);
  }

  96% {
    transform: translate(0);
  }
}

  </style>
</head>
<body>

  <div class="wrapper">
    <img 
      src="images/Logo/Logo Text Site front page.png" 
      alt="Site Logo" 
      class="logo glitch"
    />
    <div class="coming-soon">Coming Soon</div>
  </div>

</body>
</html>
